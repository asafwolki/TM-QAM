// Playback engine: never wait indefinitely for speech callbacks; supports Safari, silent auto-play and manual navigation.
let ep=0,ix=0,playing=false,token=0,timeout=null,voiceWatchdog=null,preferSilent=false,spokenSuccessfully=false;
const hasSpeech=('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window);
const $=id=>document.getElementById(id);
const setStatus=x=>{$('help').textContent=x};
function clearTimers(){if(timeout){clearTimeout(timeout);timeout=null}if(voiceWatchdog){clearTimeout(voiceWatchdog);voiceWatchdog=null}}
function stopSpeech(){if(hasSpeech){try{window.speechSynthesis.cancel()}catch(_){}}}
function cancelPlayback(){token++;clearTimers();stopSpeech()}
function refresh(){
 const chapter=stories[ep], item=chapter.scenes[ix];
 $('world').innerHTML=art(item.kind);$('date').textContent=item.date;$('bigword').textContent=item.big;
 $('narration').textContent=item.line;$('page').textContent=item.page;
 $('sceneNum').textContent=`סיפור ${ep+1} / 3 · קטע ${ix+1}/${chapter.scenes.length}`;
 $('timeline').innerHTML=chapter.scenes.map((s,i)=>`<div class="unit"><span style="width:${i<=ix?100:0}%"></span></div>`).join('');
 document.querySelectorAll('[data-ep]').forEach(b=>b.classList.toggle('active',Number(b.dataset.ep)===ep));
 $('play').textContent=playing?'❚❚ השהה':'▶ הפעל סיפור וקריינות';
 $('stage').classList.toggle('talking',playing&&!preferSilent);
 $('silent').classList.toggle('active',preferSilent);
}
function estimatedMs(line){return Math.max(7500,Math.min(26000, 3600 + line.length*68));}
function scheduleNext(t,ms){clearTimers();timeout=setTimeout(()=>advance(t),ms);}
function narrationFallback(t,msg){if(t!==token||!playing)return;setStatus(msg);scheduleNext(t,estimatedMs(stories[ep].scenes[ix].line));}
function speak(){
 const t=++token;
 if(!playing)return;
 clearTimers();stopSpeech();refresh();
 const item=stories[ep].scenes[ix];
 if(preferSilent){narrationFallback(t,'🔇 מצב כתוביות: המעבר לסצנה הבאה מתבצע אוטומטית.');return;}
 if(!hasSpeech){narrationFallback(t,'אין קריינות זמינה בדפדפן הזה; ממשיכים אוטומטית עם כתוביות.');return;}
 try{
   const synth=window.speechSynthesis;
   const u=new SpeechSynthesisUtterance(item.line);
   u.lang='he-IL';u.rate=0.98;u.pitch=1.03;u.volume=1;
   const vs=synth.getVoices()||[];const he=vs.filter(v=>/^he([_-]|$)/i.test(v.lang));
   if(he.length)u.voice=he[0];
   let began=false,finished=false;
   u.onstart=()=>{if(t!==token||!playing)return;began=true;spokenSuccessfully=true;setStatus('🎙️ הקריינות פועלת. אפשר לעצור או לעבור קטע בכל רגע.');};
   u.onend=()=>{if(t!==token||finished)return;finished=true;clearTimers();timeout=setTimeout(()=>advance(t),600);};
   u.onerror=()=>{if(t!==token||finished)return;finished=true;spokenSuccessfully=false;stopSpeech();narrationFallback(t,'לא הצלחנו להשמיע קול במכשיר הזה. הכתוביות והמעבר האוטומטי פועלים.');};
   // A watchdog is essential: on iOS some synthesis implementations never fire onstart/onend/onerror.
   voiceWatchdog=setTimeout(()=>{
     if(t!==token||finished||!playing)return;
     finished=true;
     if(!began){setStatus('הקריינות לא התחילה. המשך אוטומטי עם כתוביות.');}
     else {setStatus('ממשיכים לקטע הבא…');}
     stopSpeech();
     advance(t);
   },estimatedMs(item.line)+6000);
   setStatus(he.length?'🎙️ משתמשים בקול העברי של המכשיר…':'🎙️ מנסים להפעיל את קול המכשיר. אם אינו תומך בעברית, הכתוביות ימשיכו.');
   synth.speak(u);
   // Some Safari builds start paused; resume remains safe but not required.
   if(synth.paused){try{synth.resume()}catch(_){}}
 }catch(e){narrationFallback(t,'לא הצלחנו להפעיל קריינות; ממשיכים אוטומטית עם כתוביות.');}
}
function advance(t){if(t!==token||!playing)return;
 cancelPlayback();
 if(ix<stories[ep].scenes.length-1){ix++;speak()}else{playing=false;refresh();showQuiz(true)}
}
function start(){
 if(playing){playing=false;cancelPlayback();refresh();setStatus('הסיפור מושהה. לחצו על הפעלה כדי להמשיך.');return;}
 playing=true;speak();
}
function go(delta){if(delta>0&&ix===stories[ep].scenes.length-1){cancelPlayback();playing=false;refresh();showQuiz(false);return;}cancelPlayback();ix=Math.min(stories[ep].scenes.length-1,Math.max(0,ix+delta));if(playing)speak();else refresh()}
$('play').addEventListener('click',start);
$('prev').addEventListener('click',()=>go(-1));
$('next').addEventListener('click',()=>go(1));
document.querySelectorAll('[data-ep]').forEach(b=>b.addEventListener('click',()=>{cancelPlayback();playing=false;ep=Number(b.dataset.ep);ix=0;refresh()}));
$('silent').addEventListener('click',()=>{preferSilent=!preferSilent;cancelPlayback();if(playing)speak();else{refresh();setStatus(preferSilent?'מצב כתוביות בלבד הופעל':'קריינות תופעל בלחיצה על הפעלה')}});
$('repeat').addEventListener('click',()=>{cancelPlayback();playing=true;preferSilent=false;speak()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){playing=false;cancelPlayback();refresh();setStatus('הסיפור הושהה כשעברת לאפליקציה אחרת. לחצו על הפעלה כדי להמשיך.')}});
function openOverlay(html){if(playing){playing=false;cancelPlayback();refresh()}$('panel').innerHTML=html+'<div style="padding-top:16px"><button id="closePanel">סגור</button></div>';$('overlay').classList.add('show');$('closePanel').onclick=()=>$('overlay').classList.remove('show')}
function showQuiz(automatic=false){const q=stories[ep].quiz;let html=`<h2>🧠 שנייה לפני שממשיכים</h2><p>${q.q}</p><div class="quiz">${q.opts.map((o,i)=>`<button data-a="${i}">${o}</button>`).join('')}</div><p id="quizmsg" style="color:#ffcc7d"></p>`;openOverlay(html);document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const good=Number(b.dataset.a)===q.answer;b.classList.add(good?'correct':'wrong');$('quizmsg').textContent=good?'✅ נכון!':`❌ לא. התשובה הנכונה: ${q.opts[q.answer]}`;if(good&&automatic&&ep<2){$('quizmsg').innerHTML+=' <button id="gotoNext" style="margin:8px">לסיפור הבא ←</button>';$('gotoNext').onclick=()=>{$('overlay').classList.remove('show');ep++;ix=0;playing=false;refresh();setStatus("לחצו על הפעלה כדי להתחיל את הפרק הבא עם קריינות.")}}})}
$('test').onclick=()=>showQuiz(false);$('sources').onclick=()=>openOverlay(`<h2>📚 מקורות ודיוק היסטורי</h2><p>הקריינות היא פרפרזה לימודית, המבוססת על פרק 1: <strong>מגלות בבל ליהודה</strong>, עמ׳ 8–24 בספר <em>ואלה תולדות</em> מאת אורלי אילני (מטח, 2012).</p><p>הדמויות המצוירות, הלבוש, נופי העיר והתנועות הם <strong>המחשה אמנותית</strong>, לא שחזור מדויק ומוכח. איש מהדמויות ההיסטוריות אינו משמיע דיאלוג שהומצא.</p><p>הקול נוצר במכשיר באמצעות מנגנון הקראת טקסט (Speech Synthesis); איכותו ותמיכתו בעברית משתנות בין דפדפנים ומכשירים.</p><p>להשוואה למקור: <a href="https://school.kotar.cet.ac.il/kotarapp/index/Book.aspx?nBookID=97196387" target="_blank" rel="noopener">ספר הלימוד באתר כותר</a>.</p><p>הסדרה מציגה את התוכן המרכזי, ואינה מבטיחה לכסות כל פרט במבחן.</p>`);
refresh();
</script></body></html>
